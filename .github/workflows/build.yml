
name: Build Minecraft Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle -p UrbanaTechMod-Fabric-1.21.1-source build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UrbanaTechMod-JAR
          path: UrbanaTechMod-Fabric-1.21.1-source/build/libs/*.jar
